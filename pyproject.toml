[project]
name = "chest-xray-classifier"
version = "1.0.0"
description = "Pneumonia detection from chest radiographs with EfficientNetB2 transfer learning"
requires-python = ">=3.10"
dependencies = [
    "keras>=3.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "scikit-learn>=1.4",
    "tensorflow>=2.16",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chest_xray*"]
